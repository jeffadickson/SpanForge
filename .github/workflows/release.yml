name: Release NuGet Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.1.0-preview.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, Test, Pack & Publish NuGet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 11 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "package_version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved package version: $VER"

      - name: Restore, Build & Test
        run: |
          dotnet restore SpanForge.slnx
          dotnet build SpanForge.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.package_version }}
          dotnet test SpanForge.slnx -c Release --no-build --verbosity normal

      - name: Pack NuGet packages (.nupkg + .snupkg)
        shell: bash
        run: |
          dotnet pack SpanForge.slnx -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.package_version }} -o ./artifacts/packages
          ls -la ./artifacts/packages
          PKG="./artifacts/packages/SpanForge.${{ steps.version.outputs.package_version }}.nupkg"
          unzip -l "$PKG" | grep "analyzers/dotnet/cs/SpanForge.Generators.dll"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.version.outputs.package_version }}
          path: ./artifacts/packages/*

      - name: Publish to NuGet.org (when NUGET_API_KEY secret is configured)
        if: ${{ secrets.NUGET_API_KEY != '' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./artifacts/packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./artifacts/packages/* \
            --title "SpanForge $GITHUB_REF_NAME" \
            --generate-notes
